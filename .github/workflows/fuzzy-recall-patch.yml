name: Patch tolerant recall matching

on:
  push:
    paths:
      - '.github/workflows/fuzzy-recall-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recall matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/DutchTutorV5.tsx')
          s = p.read_text()
          marker = 'const uid = () => Math.random().toString(36).slice(2, 10);'
          helper = r'''
// Recall grading ignores case, punctuation, accents and spacing, and forgives only tiny spelling slips.
// It deliberately does NOT accept missing words or a different sentence as correct.
function editDistance(a:string,b:string){
  const prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let left=i,diag=i-1;
    for(let j=1;j<=b.length;j++){
      const up=prev[j];
      const cur=a[i-1]===b[j-1]?diag:1+Math.min(diag,up,left);
      prev[j]=cur;diag=up;left=cur;
    }
  }
  return prev[b.length];
}
function answerMatches(input:string,target:string){
  const a=normalize(input).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const b=normalize(target).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!a||!b)return false;
  if(a===b)return true;
  if(a.replace(/\s/g,'')===b.replace(/\s/g,''))return true;
  const maxEdits=b.length>=18?2:b.length>=7?1:0;
  if(Math.abs(a.length-b.length)>maxEdits)return false;
  return editDistance(a,b)<=maxEdits;
}
'''.strip()
          if 'function answerMatches(' not in s:
              s = s.replace(marker, helper + '\n' + marker)
          replacements = {
              'normalize(reviewInput)===normalize(currentReview.dutch)': 'answerMatches(reviewInput,currentReview.dutch)',
              'normalize(teachInput)===normalize(currentTeach.dutch)': 'answerMatches(teachInput,currentTeach.dutch)',
              'normalize(quizRepairInput)===normalize(currentQuizMiss.correction)': 'answerMatches(quizRepairInput,currentQuizMiss.correction)',
          }
          for old,new in replacements.items():
              s = s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/DutchTutorV5.tsx
          git commit -m "Allow minor recall typos without accepting incomplete answers"
          git push
